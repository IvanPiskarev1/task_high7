<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>

    <style>
        body {
            font-family: Arial;
            background: #e8f0fe;
            text-align: center;
            padding-top: 100px;
        }

        .login-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: #2457a6;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Вход в систему</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p style="color:red">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Логин"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Пароль"
            required
        >

        <button type="submit">
            Войти
        </button>

    </form>

</div>

</body>
</html>
